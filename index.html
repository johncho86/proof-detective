<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>증명 탐정 사무소</title>
<script src="claude-shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F6; --paper:#FFFFFF; --grid:rgba(43,89,195,.07); --ink:#16213A; --muted:#4D5872; --line:#CDD4E1;
  --cobalt:#2B59C3; --on-cobalt:#FFFFFF; --cobalt-soft:#E6EDFB;
  --gold:#C77F14; --gold-ink:#7A4206; --gold-soft:#FCF0DC; --on-gold:#FFFFFF;
  --red:#B93A0C; --red-soft:#FDECE3; --ok:#1F7A4D; --ok-soft:#E3F4EA;
  --stage:#0C1226; --stage-ink:#F2F4FA; --stage-muted:#AEB8D3; --stage-gold:#F0B455;
  --display:'Black Han Sans','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1424; --paper:#172036; --grid:rgba(120,150,230,.07); --ink:#E8ECF6; --muted:#A9B3C9; --line:#2C3752;
    --cobalt:#86A7F2; --on-cobalt:#0E1424; --cobalt-soft:#1D2B4D;
    --gold:#F0B455; --gold-ink:#F5C97A; --gold-soft:#33280F; --on-gold:#1A1206;
    --red:#F08A5D; --red-soft:#3A1D12; --ok:#5CC48C; --ok-soft:#14301F;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1424; --paper:#172036; --grid:rgba(120,150,230,.07); --ink:#E8ECF6; --muted:#A9B3C9; --line:#2C3752;
  --cobalt:#86A7F2; --on-cobalt:#0E1424; --cobalt-soft:#1D2B4D;
  --gold:#F0B455; --gold-ink:#F5C97A; --gold-soft:#33280F; --on-gold:#1A1206;
  --red:#F08A5D; --red-soft:#3A1D12; --ok:#5CC48C; --ok-soft:#14301F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--stage)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
[hidden]{display:none!important}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--stage);color:var(--stage-ink)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--stage-ink);padding:4px 0}
.logo span{font-family:var(--display);font-size:22px;letter-spacing:.5px}
.tb-spacer{flex:1}
.toggle{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid #33406A;background:transparent;color:var(--stage-muted);font-size:14px}
.toggle[aria-pressed="true"]{background:#1E2A4F;color:var(--stage-ink);border-color:#4A5A8F}
.ai-badge{font-size:13px;color:var(--stage-muted);padding:4px 10px;border-radius:999px;background:#18213D}
.ai-badge.on{color:#9EE0BC}

main{max-width:1180px;margin:0 auto;padding:22px 18px 48px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--cobalt)}
.btn-primary{background:var(--cobalt);color:var(--on-cobalt);border-color:var(--cobalt)}
.btn-gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-big{min-height:56px;font-size:17px;padding:0 28px;border-radius:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
h1,h2,h3{line-height:1.3}
.statement{font-size:clamp(19px,2.6vw,25px);font-weight:700;margin:4px 0 0}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:8px;padding:3px 10px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;margin-bottom:26px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,6vw,64px);margin:0;letter-spacing:1px}
.hero p{margin:8px 0 0;font-size:17px;color:var(--muted);max-width:34em}
.files{display:grid;gap:14px}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;text-align:left;width:100%;
  background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--cobalt);border-radius:14px;padding:18px 20px}
.file.gold{border-left-color:var(--gold)}
.file:hover{transform:translateX(4px);transition:transform .15s}
.file .when{font-size:13px;font-weight:700;color:var(--muted)}
.file .what{font-size:20px;font-weight:700}
.file .how{font-size:14px;color:var(--muted)}
.file .num{font-family:var(--display);font-size:34px;color:var(--cobalt);width:48px;text-align:center}
.file.gold .num{color:var(--gold)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .thief-wrap{display:none}}

/* puzzle */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none;font-size:14px}
.steps li{padding:5px 12px;border-radius:8px;color:var(--muted);background:transparent;border:1px solid var(--line)}
.steps li.now{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.steps li.done{background:var(--cobalt-soft);color:var(--cobalt);border-color:transparent}
.strat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.strat button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:17px;font-weight:700}
.strat button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt);color:var(--on-cobalt)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;padding:10px 12px}
textarea{resize:vertical;min-height:64px}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;margin-top:16px}
@media (max-width:820px){.board{grid-template-columns:1fr}.strat{grid-template-columns:1fr}}
.deck{background:var(--cobalt-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cardbtn{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15.5px;line-height:1.55;box-shadow:0 2px 0 var(--line)}
.cardbtn:hover{border-color:var(--cobalt)}
.slots{display:flex;flex-direction:column;gap:9px}
.slot{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:stretch}
.slot .n{border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700;display:flex;align-items:center;justify-content:center}
.slot .empty{border:2px dashed var(--line);border-radius:12px;padding:13px 15px;color:var(--muted);font-size:14px}
.slot .filled{border-color:var(--cobalt);background:var(--cobalt-soft)}
.slot.bad .filled{border-color:var(--red);background:var(--red-soft)}
.slot.bad .n{background:var(--red)}
.pdrag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pdrag.picked{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.pdrag.lifting{opacity:.35}
.slot.over .empty,.slot.over .filled{outline:3px solid var(--cobalt);outline-offset:1px}
.slot .empty.target{border-color:var(--cobalt);color:var(--cobalt);cursor:pointer}
.pghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) rotate(-1.5deg);max-width:340px;background:var(--paper);color:var(--ink);border:2px solid var(--cobalt);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.5;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.fb{border-radius:12px;padding:12px 15px;margin-top:12px;font-size:15px}
.fb.bad{background:var(--red-soft);color:var(--ink);border:1px solid var(--red)}
.fb.good{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.hint{background:var(--gold-soft);border:1px solid var(--gold)}
.proofdone ol{margin:8px 0 0;padding-left:22px}
.proofdone li{margin:4px 0}

/* cases */
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:900px){.case-grid{grid-template-columns:1fr}}
.proof-lines{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pl{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:15.5px}
.pl b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold-ink)}
.case-head{display:flex;gap:14px;align-items:center;background:var(--stage);color:var(--stage-ink);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.case-head .t{font-family:var(--display);font-size:24px;color:var(--stage-gold)}
.case-head .s{font-size:15px;color:var(--stage-muted)}
.gauge{display:flex;gap:4px;height:20px;margin-top:8px}
.gauge div{border-radius:5px;background:var(--gold-soft);border:1px solid var(--gold);transition:background .4s}
.gauge div.on{background:var(--gold)}
.gauge-l{display:flex;gap:4px;font-size:13px;margin-top:4px}
.gauge-l span{color:var(--muted)}
.gauge-l span.on{color:var(--gold-ink);font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px 2px 4px 0}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;font-size:15.5px;line-height:1.55}
.msg.thief{align-self:flex-start;background:var(--stage);color:var(--stage-ink);border-top-left-radius:4px}
.msg.student{align-self:flex-end;background:var(--cobalt-soft);border:1px solid var(--cobalt);border-top-right-radius:4px}
.msg .who{display:block;font-size:12px;font-weight:700;opacity:.8;margin-bottom:2px}
.gain{align-self:center;font-size:13px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);padding:3px 12px;border-radius:999px}
.count{font-family:var(--display);font-size:28px;color:var(--gold-ink)}
.speaker{font-weight:700;color:var(--cobalt)}
.typing{align-self:flex-start;color:var(--muted);font-size:14px}
.mini-thief{width:64px;height:76px;flex:none}
.notice{font-size:13px;color:var(--muted);margin-top:6px}

/* modal (지목 심문) */
.modal{position:fixed;inset:0;z-index:40;background:rgba(6,10,24,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{background:var(--stage);color:var(--stage-ink);border:2px solid var(--stage-gold);border-radius:18px;max-width:640px;width:100%;padding:22px;display:grid;grid-template-columns:120px 1fr;gap:18px}
.modal-box .callee{font-family:var(--display);font-size:34px;color:var(--stage-gold);line-height:1.1}
.modal-box .q{font-size:18px;font-weight:600;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid #3A4870;background:#18213D;color:var(--stage-ink);font-size:16px}
.opt:hover{border-color:var(--stage-gold)}
@media (max-width:560px){.modal-box{grid-template-columns:1fr}.modal-box .mini-thief{display:none}}

/* solved */
.bigcount{font-family:var(--display);font-size:clamp(64px,12vw,120px);line-height:1;color:var(--gold)}
.board-note{font-size:18px;font-weight:700;background:var(--ink);color:var(--paper);display:inline-block;padding:8px 16px;border-radius:10px}

/* report & present */
.present{position:fixed;inset:0;z-index:55;background:var(--stage);color:var(--stage-ink);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.present-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.present h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,58px);color:var(--stage-gold);margin:0}
.present .sub{color:var(--stage-muted);font-size:clamp(16px,2vw,20px)}
.pcard{background:#141D3A;border:2px solid #2E3B66;border-radius:18px;padding:18px 22px}
.pcard .q{font-size:clamp(15px,1.8vw,18px);color:var(--stage-gold);font-weight:700}
.pcard .a{font-size:clamp(22px,3vw,34px);line-height:1.45;margin-top:6px;font-weight:600}
.pcard .who{font-size:clamp(15px,1.8vw,18px);color:var(--stage-muted);margin-top:6px}
.picker{font-family:var(--display);font-size:clamp(40px,7vw,80px);color:#FFFFFF;text-align:center;min-height:1.2em}
.pbtn{min-height:52px;padding:0 22px;border-radius:14px;border:1px solid #4A5A8F;background:#1E2A4F;color:var(--stage-ink);font-size:17px;font-weight:700}
.pbtn.gold{background:var(--stage-gold);color:#1A1206;border-color:var(--stage-gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;text-align:left}
.chip:hover{border-color:var(--cobalt)}

/* ads game */
.fact{border-left:6px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:14px 16px;font-size:clamp(17px,2.2vw,20px);font-weight:600}
.fact small{display:block;font-size:13px;font-weight:700;color:var(--ok);margin-bottom:2px}
.claim-wrap{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.claim-wrap .mini-thief{width:72px;height:auto}
.claim{flex:1;background:var(--stage);color:var(--stage-ink);border-radius:4px 16px 16px 16px;padding:14px 18px;font-size:clamp(17px,2.2vw,20px);line-height:1.55}
.claim.ad{background:#2A1F4A;border:2px solid var(--stage-gold)}
.claim .lbl{display:block;font-size:12px;font-weight:700;color:var(--stage-gold);margin-bottom:2px}
.strat.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.strat button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.strat button.wrong{border-color:var(--red);background:var(--red-soft);color:var(--ink)}
.qlabel{font-weight:700;margin-top:16px}
.helpbox table{border-collapse:collapse;width:100%;font-size:15px;margin-top:8px}
.helpbox td,.helpbox th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.billboard{background:#2A1F4A;color:var(--stage-ink);border:3px solid var(--stage-gold);border-radius:16px;padding:20px 22px}
.billboard .prod{font-family:var(--display);font-size:clamp(24px,3.4vw,34px);color:var(--stage-gold)}
.billboard .copy{font-size:clamp(17px,2.2vw,21px);margin-top:6px;line-height:1.6}

/* race game */
.finish{height:12px;border-radius:4px;background:repeating-conic-gradient(#16213A 0 25%,#FFFFFF 0 50%) 0 0/12px 12px;margin-bottom:6px}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.lane{background:#A8482A;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 12px;color:#FFFFFF;border:0;font:inherit}
.lane .rk{font-family:var(--display);font-size:clamp(15px,2.2vw,20px);color:#FFE7C2}
.lane .nm{font-size:13px;font-weight:700;min-height:1.4em}
button.lane{cursor:pointer}
.tok{width:clamp(40px,7vw,68px);aspect-ratio:1/1;border-radius:50%;overflow:hidden;display:block;border:3px solid #FFFFFF;flex:none}
.tok svg{width:100%;height:100%;display:block}
.tok.empty{background:transparent;border:2px dashed rgba(255,255,255,.65)}
.tok.new{animation:dropin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes dropin{from{transform:translateY(-34px) scale(.6);opacity:0}}
.drag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.drag.lifting{opacity:.35}
.mchip.picked{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.lane.over{outline:3px solid #FFE7C2;outline-offset:-3px;filter:brightness(1.12)}
.lane.target{outline:2px dashed #FFE7C2;outline-offset:-4px;cursor:pointer}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px;color:var(--ink);filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.ghost .tok{width:64px}
.mchips{display:flex;flex-wrap:wrap;gap:10px}
.mchip{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:16px;min-height:54px}
.mchip:hover{border-color:var(--cobalt)}
.mchip .tok{width:46px;border-width:2px}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:760px){.clues{grid-template-columns:1fr}}
.clue{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:15px;line-height:1.5;text-align:left;width:100%;color:var(--ink)}
.clue .cn{font-weight:700;color:var(--muted)}
.clue .mk{font-size:13px;font-weight:700;white-space:nowrap}
.clue.ok{border-color:var(--ok);background:var(--ok-soft)} .clue.ok .mk{color:var(--ok)}
.clue.no{border-color:var(--red);background:var(--red-soft)} .clue.no .mk{color:var(--red)}
.clue.sel{outline:3px solid var(--gold);outline-offset:-2px}
.clue .newtag{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:0 6px}
@media (prefers-reduced-motion: reduce){.tok.new{animation:none}}

/* cutscene */
.cs{position:fixed;inset:0;z-index:50;background:var(--stage);color:var(--stage-ink);overflow:hidden;display:flex;flex-direction:column}
.cs::before,.cs::after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000;z-index:3}
.cs::before{top:0}.cs::after{bottom:0}
.cs-spot{position:absolute;inset:0;background:radial-gradient(ellipse 45% 60% at 50% 42%,rgba(240,180,85,.22),transparent 70%)}
.cs-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;text-align:center;padding:20px;transition:opacity .6s}
.cs-title .k{font-size:16px;color:var(--stage-muted);letter-spacing:2px}
.cs-title .h{font-family:var(--display);font-size:clamp(40px,8vw,84px);color:var(--stage-gold);margin-top:6px}
.cs-actor{position:absolute;left:50%;top:13vh;transform:translateX(-50%);width:min(42vh,320px);z-index:2;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.cs-actor.off{transform:translateX(-50%) translateY(30px);opacity:0}
.cs-box{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(9vh + 18px + env(safe-area-inset-bottom,0px));width:min(860px,calc(100% - 32px));z-index:4;
  background:rgba(12,18,38,.92);border:2px solid var(--stage-gold);border-radius:16px;padding:18px 22px 14px;min-height:130px}
.cs-name{position:absolute;top:-16px;left:18px;background:var(--stage-gold);color:#1A1206;font-weight:700;font-size:14px;padding:3px 12px;border-radius:8px}
.cs-text{font-size:clamp(18px,2.4vw,23px);line-height:1.6;min-height:2.6em}
.cs-next{font-size:13px;color:var(--stage-muted);text-align:right;margin-top:4px}
.cs-skip{position:absolute;right:16px;top:calc(9vh + 12px);z-index:5;background:transparent;border:1px solid #4A5A8F;color:var(--stage-muted);border-radius:999px;padding:6px 14px;font-size:14px}
.stamp{position:absolute;left:50%;top:38%;z-index:6;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0;
  font-family:var(--display);font-size:clamp(60px,12vw,130px);color:#E2453C;border:8px solid #E2453C;border-radius:18px;padding:0 26px;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.stamp.hit{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:.92}

/* thief svg */
.thief{width:100%;height:auto;display:block;overflow:visible}
.thief .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 200px}
.thief .eyes{animation:blink 5s infinite;transform-origin:100px 118px}
.thief .mouth-open{opacity:0}
.thief.talking .mouth-open{animation:talk .22s ease-in-out infinite alternate}
.thief.talking .mouth-smile{opacity:0}
.thief .sweat{opacity:0;transition:opacity .3s}
.thief.rattled .sweat,.thief.defeated .sweat{opacity:1}
.thief .brow-l,.thief .brow-r{transition:transform .3s;transform-box:fill-box;transform-origin:center}
.thief .brow-r{transform:translateY(-4px) rotate(-8deg)}
.thief.rattled .brow-l{transform:rotate(14deg) translateY(2px)}
.thief.rattled .brow-r{transform:rotate(-14deg) translateY(2px)}
.thief.defeated .brow-l{transform:rotate(-16deg) translateY(4px)}
.thief.defeated .brow-r{transform:rotate(16deg) translateY(4px)}
.thief .hat{transition:transform .6s;transform-box:fill-box;transform-origin:bottom center}
.thief.defeated .hat{transform:rotate(-22deg) translate(-14px,8px)}
.thief.defeated .pupil{transform:translateY(4px)}
.thief.defeated .bob{animation:slump 1.6s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes slump{to{transform:translateY(6px) rotate(-2deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{opacity:1;transform:scaleY(.5)}to{opacity:1;transform:scaleY(1.1)}}
.thief .mouth-open{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){
  .thief .bob,.thief .eyes,.thief.talking .mouth-open{animation:none}
  .thief.talking .mouth-open{opacity:1}
  .cs-actor,.stamp,.file:hover{transition:none}
}

function stamp(){ const d=new Date(); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function askSid(next){
  const root=document.getElementById('modalRoot');
  root.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="학번 입력"><div class="panel" style="max-width:420px;width:100%"><h2 style="margin:0 0 6px;font-size:22px">학번을 입력해 주세요</h2><p class="muted" style="margin:0 0 12px;font-size:14px">활동 기록을 선생님께 제출할 때 쓰여요. 이 노트북에 저장돼요.</p><label for="sidIn" style="font-weight:600">학번</label><input type="text" id="sidIn" inputmode="numeric" value="'+esc(getSid())+'" placeholder="예: 10103"><p class="notice" id="sidErr"></p><div class="row" style="margin-top:12px"><button class="btn btn-primary btn-big" id="sidOk">시작하기</button></div></div></div>';
  const inp=root.querySelector('#sidIn'); inp.focus();
  const ok=()=>{ const v=inp.value.trim(); if(v.length<2){ root.querySelector('#sidErr').textContent='학번을 정확히 입력해 주세요.'; return; } store.set('pd_sid',v); root.innerHTML=''; if(next) next(); };
  root.querySelector('#sidOk').onclick=ok; inp.onkeydown=e=>{ if(e.key==='Enter') ok(); };
}
function withSid(next){ if(getSid()) next(); else askSid(next); }
let SUBMIT_TEXT='';
function submitPanel(id, text){
  SUBMIT_TEXT=text; const link=formLink(id,text);
  return '<section class="panel" id="subPanel" style="margin-top:16px;border:2px solid var(--cobalt)"><div class="row" style="justify-content:space-between"><div style="flex:1 1 300px"><strong style="font-size:18px">선생님께 제출하기</strong><div class="muted" style="font-size:14px">'+(link?'버튼을 누르면 내 기록이 채워진 설문지가 열려요. 설문지에서 <b>제출</b>까지 눌러야 끝나요.':'선생님이 아직 설문지를 연결하지 않았어요. 기록을 복사해 두세요.')+'</div></div>'+
   (link?'<a class="btn btn-gold btn-big" href="'+esc(link)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none" id="formGo">설문지 열어 제출하기</a>':'<button class="btn" id="subCopy">기록 복사</button>')+'</div>'+
   '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:14px">제출할 내용 보기 ('+esc(id)+')</summary><pre id="subPre" style="white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 0">'+esc(text)+'</pre></details><p class="notice" id="subMsg" aria-live="polite"></p></section>';
}
function refreshSubmit(id, text){ SUBMIT_TEXT=text; const g=document.getElementById('formGo'); const l=formLink(id,text); if(g&&l) g.href=l; const pre=document.getElementById('subPre'); if(pre) pre.textContent=text; }
function bindSubmit(){
  const c=document.getElementById('subCopy'); if(c) c.onclick=()=>{ let ok=false; try{ const ta=document.createElement('textarea'); ta.value=SUBMIT_TEXT; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e){} if(!ok&&navigator.clipboard){ navigator.clipboard.writeText(SUBMIT_TEXT).catch(()=>{}); ok=true; } document.getElementById('subMsg').textContent=ok?'복사했어요.':'복사가 막혀 있어요.'; };
  const g=document.getElementById('formGo'); if(g) g.addEventListener('click',()=>{ const m=document.getElementById('subMsg'); if(m) m.textContent='새 창의 설문지에서 제출 버튼까지 꼭 눌러 주세요.'; });
}
function homeFooter(){
  return '<section class="panel" style="margin-top:18px"><div class="row" style="justify-content:space-between"><span class="muted">이 노트북의 학번: <strong style="color:var(--ink)">'+esc(getSid()||'미입력')+'</strong></span><button class="btn" id="chgSid" style="min-height:38px;font-size:14px">학번 바꾸기</button></div>'+
   '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:14px;color:var(--muted)">교사용 · 구글 설문지 연결</summary><p class="muted" style="font-size:14px">설문지에 단답형 ‘학번’, 장문형 ‘기록’ 질문을 만들고, ‘미리 채워진 링크 가져오기’에서 학번 칸에 AAA, 기록 칸에 BBB를 넣어 만든 링크를 붙여넣으세요. 여기 넣은 링크는 이 노트북에만 저장돼요.</p>'+
   '<input type="text" id="formIn" value="'+esc(store.get('pd_form')||'')+'" placeholder="https://docs.google.com/forms/d/e/…/viewform?usp=pp_url&amp;entry.…=AAA&amp;entry.…=BBB" aria-label="미리 채워진 링크"><div class="row" style="margin-top:8px"><button class="btn" id="formSave">저장</button><span class="notice" id="formMsg">'+(formCfg()?'설문지가 연결되어 있어요.':'아직 연결되지 않았어요.')+'</span></div></details></section>';
}
function bindHomeFooter(){
  document.getElementById('chgSid').onclick=()=>askSid(()=>renderHome());
  document.getElementById('formSave').onclick=()=>{ const v=document.getElementById('formIn').value.trim(); store.set('pd_form',v); document.getElementById('formMsg').textContent=!v?'연결을 지웠어요.':(formCfg()?'설문지가 연결되었어요.':'링크에서 AAA와 BBB 칸을 찾지 못했어요. 미리 채운 값이 AAA, BBB인지 확인해 주세요.'); };
}
function raceText(){ return '[삼단논법 게임] '+stamp()+'\n단서 확인 횟수: '+R.attempts+'회\n대우 도전: '+(R.cdone?'성공 (고르기 '+(R.cTries||1)+'회 만에)':'미완료'); }
function puzzleText(){ return '['+(P.sess==='prev'?'퍼즐 1, 2, 3':'퍼즐 4, 5')+'] '+stamp()+'\n\n'+P.records.map(r=>r.label+' · '+r.strat+'\n- 내 설명: '+clip(r.why,200)+'\n- 제출 '+r.attempts+'회 · 힌트 '+r.hints+'회'+(r.traps.length?' · 걸린 함정: '+r.traps.map(t=>'“'+clip(t,40)+'”').join(', '):'')+'\n- 한 줄 정리: '+clip(r.summary,200)).join('\n\n'); }
function adsText(){ return '[괴도의 광고 회사] '+stamp()+'\n첫 판정 점수: '+A.score+' / '+(ADS.length*2)+'\n'+A.log.map((x,i)=>'문장 '+(i+1)+' ('+x.type+'): '+(x.rel&&x.ver?'정확':'첫 판정 틀림')).join('\n')+((A.counters&&A.counters.length)?'\n\n내가 쓴 반례\n'+A.counters.map(c=>'- 문장 '+c.n+' ('+c.tries+'번째 제출에 인정): '+clip(c.text,150)).join('\n'):''); }
function bonusText(){ const b=A.bonus; return '[광고 회사 보너스] '+stamp()+'\n광고: '+clip(b.ad,120)+'\n내 판단: '+A.bRel+' / 괴도 해설: '+b.type+'\n내가 쓴 글: '+clip(A.bTxt,150)+'\n해설 검토: '+(A.bAgree==='ok'?'맞는 것 같다':'이상한 데가 있다')+' · '+clip(A.bWhy,150); }
function caseText(){ return '[괴도 프루프 사건] '+stamp()+'\n모둠원: '+members().join(', ')+'\n'+['c1','c2'].map(k=>{ const v=G.solved[k]; return '사건 '+CASES[k].no+': '+(v?'심문 '+v.count+'회'+(v.keyLine?' · 결정적 한 마디('+v.keyLine.name+'): '+clip(v.keyLine.text,120):''):'도전 중'); }).join('\n')+(G.report?'\n\n'+reportText():''); }

function tokHTML(n,cls){ return '<span class="tok '+(cls||'')+'" style="background:'+RACE.colors[n]+'" aria-hidden="true">'+avatarSVG(n)+'</span>'; }
function renderRace(){
  const N=RACE.names, placedCount=R.placed.filter(Boolean).length;
  let h='<section class="panel"><span class="tag">삼단논법 게임</span><h1 style="font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:6px 0 4px">런닝맨 달리기, 누가 몇 등?</h1>'+
    '<p class="muted" style="margin:0">재석, 종국, 세찬, 지효, 하하, 석진, 그리고 새 멤버 예은이까지 일곱 명이 달리기 게임을 했어요. 아래 단서는 모두 참이에요. 들어온 순서대로 멤버를 배치해 보세요.</p></section>';
  h+='<section class="panel" style="margin-top:16px"><div class="finish" aria-hidden="true"></div><div class="track" aria-label="결승선 도착 순서">';
  for(let i=0;i<7;i++){ const n=R.placed[i];
    if(n) h+='<div class="lane" data-slot="'+i+'"><span class="rk">'+(i+1)+'등</span><span class="drag" data-from="'+i+'" data-name="'+n+'" role="button" tabindex="0" aria-label="'+(i+1)+'등 '+n+'">'+tokHTML(n,i===R.last?'new':'')+'</span><span class="nm">'+n+'</span></div>';
    else h+='<div class="lane'+(R.pick?' target':'')+'" data-slot="'+i+'" role="button" tabindex="0" aria-label="'+(i+1)+'등 빈칸"><span class="rk">'+(i+1)+'등</span><span class="tok empty"></span><span class="nm"></span></div>'; }
  h+='</div>';
  if(!R.solved){
    const left=N.filter(n=>!R.placed.includes(n));
    h+='<div style="margin-top:14px"><div class="muted" style="font-size:14px;margin-bottom:8px">'+(left.length?'멤버를 끌어서 알맞은 등수 칸에 놓으세요. 확실한 단서부터 채워 보세요. 놓은 멤버는 다른 칸으로 옮기거나, 칸 밖으로 끌어내 뺄 수 있어요.':'모두 배치했어요. 단서를 확인해 보세요.')+'</div><div class="mchips">'+
      left.map(n=>'<span class="mchip drag'+(R.pick===n?' picked':'')+'" data-name="'+n+'" role="button" tabindex="0" aria-label="'+n+' 끌어서 놓기">'+tokHTML(n)+n+'</span>').join('')+'</div>'+
      (R.pick?'<div class="notice">'+R.pick+'을(를) 놓을 칸을 누르세요.</div>':'')+'</div>'+
      '<div class="row" style="margin-top:14px"><button class="btn btn-primary btn-big" id="rCheck" '+(placedCount===7?'':'disabled')+'>단서 확인하기</button><button class="btn" id="rClear" '+(placedCount?'':'disabled')+'>모두 빼기</button><span class="muted" style="font-size:14px">확인 '+R.attempts+'회</span></div>';

function laneAt(x,y){ const el=document.elementFromPoint(x,y); return el?el.closest('.lane[data-slot]'):null; }
function raceDrop(name, from, to){ const prev=R.placed[to]; R.placed[to]=name; if(from!==null && from!==to) R.placed[from]=prev; R.last=to; R.pick=null; R.results=null; sfx.place(); renderRace(); }
function raceTap(name, from){
  if(from===null){ R.pick = R.pick===name ? null : name; renderRace(); return; }
  if(R.pick && R.pick!==name){ const f=R.placed.indexOf(R.pick); raceDrop(R.pick, f>=0?f:null, from); return; }
  R.placed[from]=undefined; R.last=-1; R.pick=null; R.results=null; renderRace();
}
function enableDrag(el, name, from){
  el.addEventListener('pointerdown', e=>{
    if(e.button>0) return; e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let ghost=null, moved=false;
    const move=ev=>{
      if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy)<6) return;
      if(!moved){ moved=true; ghost=document.createElement('div'); ghost.className='ghost'; ghost.innerHTML=tokHTML(name)+'<span>'+name+'</span>'; document.body.appendChild(ghost); el.classList.add('lifting'); }
      ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
      const over=laneAt(ev.clientX, ev.clientY);
      app.querySelectorAll('.lane').forEach(l=>l.classList.toggle('over', l===over));
    };
    const up=ev=>{
      document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
      if(ghost) ghost.remove(); el.classList.remove('lifting');
      if(!moved){ raceTap(name, from); return; }
      const lane=laneAt(ev.clientX, ev.clientY);
      if(lane) raceDrop(name, from, +lane.dataset.slot);
      else if(from!==null){ R.placed[from]=undefined; R.last=-1; R.results=null; renderRace(); }
      else renderRace();
    };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
  });
}
function bindRace(){
  const $=q=>app.querySelector(q);
  if(!R.solved){
    app.querySelectorAll('.drag').forEach(el=>{
      const name=el.dataset.name, from=el.dataset.from!==undefined?+el.dataset.from:null;
      enableDrag(el,name,from);
      el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); raceTap(name,from); } };
    });
    app.querySelectorAll('.lane[data-slot]').forEach(l=>{
      if(l.querySelector('.drag')) return;
      const act=()=>{ if(R.pick){ const f=R.placed.indexOf(R.pick); raceDrop(R.pick, f>=0?f:null, +l.dataset.slot); } };
      l.onclick=act; l.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } };
    });
  }
  if($('#rClear')) $('#rClear').onclick=()=>{ R.placed=[]; R.last=-1; R.pick=null; R.results=null; renderRace(); };
  if($('#rCheck')) $('#rCheck').onclick=()=>{
    const r={}; R.placed.forEach((n,i)=>r[n]=i+1); R.attempts++; R.last=-1;
    R.results=RACE.clues.map(c=>!!c.f(r));
    if(R.results.every(Boolean)){ R.solved=true; sfx.win(); } else sfx.buzz();
    renderRace(); };
  app.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.cl; const k=R.sel.indexOf(i);
    if(k>=0) R.sel.splice(k,1); else { if(R.sel.length>=2) R.sel.shift(); R.sel.push(i); } R.cfb=null; renderRace(); });
  if($('#cCheck')) $('#cCheck').onclick=()=>{
    R.cTries=(R.cTries||0)+1;
    const right=R.sel.filter(i=>RACE.contra.includes(i)).length;
    if(right===2){ R.cdone=true; sfx.chime();
      R.cfb={type:'good',html:'<strong>정답!</strong><br>'+RACE.contraText[7]+'<br>'+RACE.contraText[16]+'<br>재석이가 3등 안이므로 세찬이는 1등, 하하가 꼴찌라 예은이는 꼴찌가 아니므로 예은이는 지효보다 빨라요.'}; }
    else { sfx.buzz(); R.cfb={type:'bad',html:'두 개 중 '+right+'개가 맞아요. 순위를 정할 때 가정이 성립하지 않아서, 결론 쪽을 부정해서 거꾸로 써야 했던 단서를 찾아보세요.'}; }
    renderRace(); };
  if($('#toP1')) $('#toP1').onclick=()=>go('session','prev');
  if($('#rHome')) $('#rHome').onclick=()=>go('home');
}

  const x=t.replace(/\s/g,''); if(x.length<8) return '조금 더 구체적으로 써 주세요. (8글자 이상)';
  if(new Set(x.match(/[가-힣]/g)||[]).size<4) return '알아볼 수 있는 문장으로 써 주세요.';
  const norm=z=>String(z||'').replace(/[\s.,!?‘’'"]/g,'');
  if(norm(t)===norm(fact)||norm(t)===norm(claim)) return '문장을 그대로 옮기지 말고, 내 말로 써 주세요.';
  return '';
}
async function checkCounter(fact, claim, t){
  const m=basicText(t,fact,claim); if(m) return {ok:false,msg:m};
  if(!S.sample) return {ok:true,msg:'반례로 인정할게요.'};
  try{
    const v=await S.sample.json('고등학교 1학년 수학 수업에서 학생이 쓴 반례를 판정하라.\n사실 문장(참): '+fact+'\n괴도의 주장: '+claim+'\n학생의 반례: '+t+'\n반례로 인정하려면, 사실 문장은 여전히 참인 상황에서 괴도의 주장이 틀리는 상황이어야 한다. 표현이 서툴러도 뜻이 통하면 너그럽게 인정한다. 낱말이 사실 문장과 조금 달라도(예: 봤다≈공부했다, 연기됐다≈취소됐다, 대학에 못 갔다≈불합격, 벌점이 나왔다≈벌점을 받았다) 상황의 뜻이 같으면 인정한다. 장난이나 관계없는 내용은 인정하지 않는다.\n다음 JSON 하나만 출력하라: {"ok": true 또는 false, "feedback": "학생에게 주는 한 문장 피드백(존댓말, 45자 이내)"}',{modelTier:'quick',cache:false});
    if(v && typeof v.ok==='boolean') return {ok:v.ok, msg:String(v.feedback||'')};
  }catch(e){ if(e&&e.code==='not_granted'){ S.sample=null; setBadge(); } }
  return {ok:true,msg:'반례로 인정할게요.'};
}
// AI가 연결되어 있으면 확실히 틀린 경우(괴도의 말이 오히려 맞음, 시험 대상이 아님)만 거르고 나머지는 AI가 판정한다.
// strict는 AI 없이 기본 판정 모드일 때만 켠다.
function localCounter(it,t,strict){
  const x=it.cx; if(!x) return {ok:true};
  const s2=String(t).replace(/\s+/g,' ');
  if(x.idle && x.idle.test(s2)) return {ok:false,msg:x.idleMsg};
  if(x.pAff && x.pAff.test(s2) && x.q.test(s2) && !(x.pNeg && x.pNeg.test(s2))) return {ok:false,msg:x.pAffMsg};
  if(!strict) return {ok:true};
  if(!x.q.test(s2)) return {ok:false,msg:x.qMsg};
  if(x.notP && !x.notP.test(s2)) return {ok:false,msg:x.notPMsg};
  if(x.needReason && !(/(때문|서[\s,]|라서|으로|로 인해|탓|이유)/.test(s2) || (x.pNeg && x.pNeg.test(s2)))) return {ok:false,msg:x.reasonMsg};
  return {ok:true};
}

/* ---------- 퍼즐 ---------- */
function startSession(sess){ P = { sess, idx:0, records:[] }; loadPuzzle(); }
function loadPuzzle(){ const key = SESSIONS[P.sess][P.idx];
  Object.assign(P,{ key, step:'strategy', strategy:null, pick:null, why:{contra:'',absurd:''}, trapsHit:[], placed:[], deck:[], attempts:0, hintsUsed:0, fb:null, badSlot:-1, summary:'', directMsg:null });
  renderPuzzle(); }
function stepsHTML(){ const keys=SESSIONS[P.sess]; return '<ol class="steps" aria-label="진행">'+keys.map((k,i)=>'<li class="'+(i<P.idx?'done':i===P.idx?'now':'')+'">'+PUZZLES[k].label+'</li>').join('')+'</ol>'; }
function renderPuzzle(){
  const pz = PUZZLES[P.key];
  let h = stepsHTML()+'<section class="panel"><span class="tag">'+pz.label+'</span><p class="statement">'+esc(pz.statement)+'</p></section>';
  if(P.step==='strategy'){
    h += '<section class="panel" style="margin-top:16px"><h2 style="margin:0;font-size:19px">어떤 방법으로 증명할까?</h2>'+
      '<div class="strat two">'+[['contra','대우 이용'],['absurd','귀류법']].map(([k,l])=>'<button data-s="'+k+'" aria-pressed="'+(P.strategy===k)+'">'+l+'</button>').join('')+'</div>'+
      (P.strategy?'<label for="why" style="font-weight:600">'+DEF_Q[P.strategy]+'</label><textarea id="why" placeholder="'+DEF_PH[P.strategy]+'">'+esc(P.why[P.strategy]||'')+'</textarea>':'<p class="muted" style="margin:0">방법을 고르면 질문이 나와요.</p>')+
      (P.directMsg?'<div class="fb hint">'+esc(P.directMsg)+'</div>':'')+
      '<div class="row" style="margin-top:14px"><button class="btn btn-primary btn-big" id="goCards" '+(P.strategy?'':'disabled')+'>증명 카드 펼치기</button></div></section>';
  } else if(P.step==='cards'){
    const spec = pz[P.strategy], len = spec.orders[0].length;
    const deck = P.deck.filter(id=>!P.placed.includes(id));
    h += '<div class="fb hint" style="margin-top:16px"><strong>내 설명</strong> · '+esc(P.why[P.strategy]||'')+'<br><strong>교과서 정의</strong> · '+DEF_TEXT[P.strategy]+'</div>';
    h += '<div class="board"><section class="deck" aria-label="증명 카드"><div class="row" style="justify-content:space-between"><strong>증명 카드</strong><span class="muted" style="font-size:14px">끌어서 오른쪽 칸에 놓기</span></div>'+
      (deck.length?deck.map(id=>'<div class="cardbtn pdrag'+(P.pick===id?' picked':'')+'" data-pid="'+id+'" role="button" tabindex="0">'+esc(pz.cards[id])+'</div>').join(''):'<p class="muted" style="margin:0">남은 카드가 없어요.</p>')+
      '<p class="muted" style="font-size:13px;margin:4px 0 0">필요 없는 카드도 섞여 있어요. 쓰지 않는 카드는 여기 두면 돼요.</p></section>'+
      '<section class="panel"><div class="row" style="justify-content:space-between"><strong>나의 증명 · '+(P.strategy==='contra'?'대우 이용':'귀류법')+'</strong><button class="btn" id="reStrat" style="min-height:38px;font-size:14px">전략 다시 고르기</button></div><div class="slots" style="margin-top:10px">';
    for(let i=0;i<len;i++){ const id=P.placed[i];
      h += '<div class="slot'+(P.badSlot===i?' bad':'')+'" data-pslot="'+i+'"><span class="n">'+(i+1)+'</span>'+(id?'<div class="cardbtn filled pdrag" data-pid="'+id+'" data-from="'+i+'" role="button" tabindex="0" aria-label="'+(i+1)+'번 칸 카드">'+esc(pz.cards[id])+'</div>':'<div class="empty'+(P.pick?' target':'')+'" role="button" tabindex="0">'+(P.pick?'여기에 놓기':'카드를 끌어다 놓을 자리')+'</div>')+'</div>'; }
    h += '</div>'+(P.fb?'<div class="fb '+P.fb.type+'">'+esc(P.fb.text)+'</div>':'')+
      '<div class="row" style="margin-top:14px"><button class="btn btn-primary btn-big" id="submit" '+(P.placed.filter(Boolean).length===len?'':'disabled')+'>제출하기</button>'+
      '<button class="btn" id="hint" '+(P.hintsUsed>=2?'disabled':'')+'>조수에게 힌트 받기 · '+(2-P.hintsUsed)+'회 남음</button></div>'+
      '<p class="notice">제출 '+P.attempts+'회</p></section></div>';
  } else if(P.step==='done'){
    const order = P.solvedOrder;
    h += '<section class="panel proofdone" style="margin-top:16px;border-color:var(--ok)"><h2 style="margin:0;color:var(--ok)">증명 완성!</h2><ol>'+order.map(id=>'<li>'+esc(pz.cards[id])+'</li>').join('')+'</ol>'+
      '<p class="muted" style="margin:10px 0 0">제출 '+P.attempts+'회 · 힌트 '+P.hintsUsed+'회</p></section>'+
      '<section class="panel" style="margin-top:16px"><label for="sum" style="font-weight:700">한 줄 정리 · '+esc(pz.summary)+'</label><textarea id="sum" placeholder="내 말로 한 줄 써 보세요">'+esc(P.summary)+'</textarea>'+
      '<div class="row" style="margin-top:12px"><button class="btn btn-primary btn-big" id="next">'+(P.idx<SESSIONS[P.sess].length-1?'다음 퍼즐':'마치기')+'</button></div></section>';
  } else if(P.step==='end'){
    h = stepsHTML()+'<section class="panel" style="text-align:center;padding:36px 20px"><div style="max-width:200px;margin:0 auto">'+thiefSVG('rattled')+'</div>'+
      '<h2 style="font-family:var(--display);font-weight:400;font-size:34px;margin:12px 0 4px">퍼즐 완료</h2>'+
      (P.sess==='prev'?'<p class="muted">다음 시간에는 괴도 프루프가 직접 남긴 증명을 심문하게 될 거예요.</p>':'<p class="muted">이제 모둠으로 모여, 대표 기기에서 괴도 프루프 사건을 열어 주세요.</p>')+
      '<button class="btn btn-big" id="toHome">처음 화면</button></section>'+submitPanel(getSid(),puzzleText());
  }
  app.innerHTML = h; bindPuzzle(); bindSubmit();
}
function pSlotAt(x,y){ const el=document.elementFromPoint(x,y); return el?el.closest('[data-pslot]'):null; }
function pDrop(id, from, to){ const prev=P.placed[to]; P.placed[to]=id; if(from!==null && from!==to) P.placed[from]=prev; P.pick=null; P.badSlot=-1; sfx.place(); renderPuzzle(); }
function pTap(id, from){
  if(from===null){ P.pick = P.pick===id ? null : id; renderPuzzle(); return; }
  if(P.pick && P.pick!==id){ const f=P.placed.indexOf(P.pick); pDrop(P.pick, f>=0?f:null, from); return; }
  P.placed[from]=undefined; P.pick=null; P.badSlot=-1; renderPuzzle();
}
function enablePDrag(el, id, from){
  el.addEventListener('pointerdown', e=>{
    if(e.button>0) return; e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let ghost=null, moved=false;
    const move=ev=>{
      if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy)<6) return;
      if(!moved){ moved=true; ghost=document.createElement('div'); ghost.className='pghost'; ghost.textContent=el.textContent; document.body.appendChild(ghost); el.classList.add('lifting'); }
      ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
      const over=pSlotAt(ev.clientX, ev.clientY);
      app.querySelectorAll('[data-pslot]').forEach(sl=>sl.classList.toggle('over', sl===over));
    };
    const up=ev=>{
      document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
      if(ghost) ghost.remove(); el.classList.remove('lifting');
      if(!moved){ pTap(id, from); return; }
      const sl=pSlotAt(ev.clientX, ev.clientY);
      if(sl) pDrop(id, from, +sl.dataset.pslot);
      else if(from!==null){ P.placed[from]=undefined; P.badSlot=-1; renderPuzzle(); }
      else renderPuzzle();
    };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
  });
}
function bindPuzzle(){
  const pz = PUZZLES[P.key]; const $=s=>app.querySelector(s);
  const why=$('#why'); if(why) why.oninput=()=>{ P.why[P.strategy]=why.value; };
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ P.strategy=b.dataset.s; P.directMsg=null; renderPuzzle(); const w=app.querySelector('#why'); if(w) w.focus(); });
  if($('#goCards')) $('#goCards').onclick=()=>{
    if(P.strategy==='direct'){ P.directMsg=pz.direct; sfx.buzz(); renderPuzzle(); return; }
    if(!pz[P.strategy]){ P.directMsg=pz.noContra||pz.direct; sfx.buzz(); renderPuzzle(); return; }
    const m=basicText(P.why[P.strategy]||'','',''); if(m){ P.directMsg=(P.strategy==='contra'?'대우를 이용한 증명법':'귀류법')+'을 내 말로 먼저 설명해 주세요. '+m; sfx.buzz(); renderPuzzle(); return; }
    const spec=pz[P.strategy]; P.deck=shuffle(spec.orders[0].concat(Object.keys(spec.traps))); P.placed=[]; P.fb=null; P.badSlot=-1; P.step='cards'; sfx.place(); renderPuzzle(); };
  app.querySelectorAll('.pdrag').forEach(el=>{ const id=el.dataset.pid, from=el.dataset.from!==undefined?+el.dataset.from:null; enablePDrag(el,id,from); el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pTap(id,from); } }; });
  app.querySelectorAll('[data-pslot] .empty').forEach(el=>{ const i=+el.parentElement.dataset.pslot; const act=()=>{ if(P.pick){ const f=P.placed.indexOf(P.pick); pDrop(P.pick,f>=0?f:null,i); } }; el.onclick=act; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } }; });
  if($('#reStrat')) $('#reStrat').onclick=()=>{ P.step='strategy'; P.fb=null; P.pick=null; renderPuzzle(); };
  if($('#hint')) $('#hint').onclick=()=>{ const hs=pz[P.strategy].hints; P.fb={type:'hint',text:'조수 · '+hs[Math.min(P.hintsUsed,hs.length-1)]}; P.hintsUsed++; renderPuzzle(); };
  if($('#submit')) $('#submit').onclick=()=>{
    const spec=pz[P.strategy]; P.attempts++;
    const trapAt = P.placed.findIndex(id=>spec.traps[id]);
    if(trapAt>=0){ if(!P.trapsHit.includes(P.placed[trapAt])) P.trapsHit.push(P.placed[trapAt]); P.fb={type:'bad',text:spec.traps[P.placed[trapAt]]}; P.badSlot=trapAt; sfx.buzz(); return renderPuzzle(); }
    const ok = spec.orders.find(o=>o.every((id,i)=>P.placed[i]===id));
    if(ok){ P.solvedOrder=ok; P.step='done'; P.fb=null; sfx.win(); return renderPuzzle(); }
    let best=0; spec.orders.forEach(o=>{ let k=0; while(k<o.length && P.placed[k]===o[k]) k++; best=Math.max(best,k); });
    P.badSlot=best; P.fb={type:'bad',text:(best+1)+'번째 칸부터 다시 볼까요? 앞 문장에서 자연스럽게 이어지는 카드인지 확인해 보세요.'}; sfx.buzz(); renderPuzzle(); };
  if($('#sum')) $('#sum').oninput=e=>P.summary=e.target.value;
  if($('#next')) $('#next').onclick=()=>{ P.records.push({label:pz.label, strat:P.strategy==='contra'?'대우':'귀류법', why:P.why[P.strategy]||'', attempts:P.attempts, hints:P.hintsUsed, traps:P.trapsHit.map(id=>pz.cards[id]), summary:P.summary}); if(P.idx<SESSIONS[P.sess].length-1){ P.idx++; loadPuzzle(); } else { P.step='end'; renderPuzzle(); } };
  if($('#toHome')) $('#toHome').onclick=()=>go('home');
}

/* ---------- 컷신 ---------- */
function cutscene({kicker, heading, lines, finalStamp}){
  return new Promise(resolve=>{
    const root=document.getElementById('csRoot');
    root.innerHTML='<div class="cs" role="dialog" aria-label="괴도 프루프 등장 장면"><div class="cs-spot"></div>'+
      '<div class="cs-title" id="csT"><div class="k">'+esc(kicker)+'</div><div class="h">'+esc(heading)+'</div></div>'+
      '<div class="cs-actor off" id="csA">'+thiefSVG(lines[0].m)+'</div>'+
      '<div class="cs-box" id="csB" hidden><span class="cs-name">괴도 프루프</span><div class="cs-text" id="csX" aria-live="polite"></div><div class="cs-next">화면을 누르거나 Enter를 눌러 계속</div></div>'+
      '<button class="cs-skip" id="csS">건너뛰기</button>'+(finalStamp?'<div class="stamp" id="csStamp">자백</div>':'')+'</div>';
    const T=root.querySelector('#csT'), A=root.querySelector('#csA'), B=root.querySelector('#csB'), X=root.querySelector('#csX');
    let i=-1, typing=null, full='', ended=false;
    sfx.sting();
    const finish=()=>{ if(ended) return; ended=true; clearInterval(typing); stopSpeech(); document.removeEventListener('keydown',key); root.innerHTML=''; resolve(); };
    const show=n=>{ i=n; if(i>=lines.length){
        if(finalStamp){ const st=root.querySelector('#csStamp'); B.hidden=true; st.classList.add('hit'); sfx.stamp(); setTimeout(()=>sfx.win(),350); setTimeout(finish,2200); }
        else finish(); return; }
      const ln=lines[i]; A.querySelector('.thief').setAttribute('class','thief '+ln.m); full=ln.t; X.textContent='';
      speak(ln.t);
      if(reduceMotion){ X.textContent=full; return; }
      let k=0; clearInterval(typing); typing=setInterval(()=>{ k++; X.textContent=full.slice(0,k); if(k>=full.length){ clearInterval(typing); typing=null; } },38); };
    const advance=()=>{ if(i<0) return; if(typing){ clearInterval(typing); typing=null; X.textContent=full; return; } stopSpeech(); show(i+1); };
    const key=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); advance(); } if(e.key==='Escape') finish(); };
    document.addEventListener('keydown',key);
    root.querySelector('.cs').addEventListener('click',e=>{ if(e.target.id==='csS') return; advance(); });
    root.querySelector('#csS').onclick=finish;
    setTimeout(()=>{ T.style.opacity='0'; A.classList.remove('off'); setTimeout(()=>{ B.hidden=false; show(0); },650); }, reduceMotion?400:1800);
  });
}

/* ---------- 괴도 판정 ---------- */
function mentionsLine(t,n){ const re=new RegExp('(^|[^0-9])'+n+'\\s*(번|줄|번째)'); return re.test(t) || (n===1 && /첫\s*(번째)?\s*줄|첫\s*문장|맨\s*처음/.test(t)); }
function localJudge(c,text){
  const L=c.local, g=C.gauge, r={point:false,reason:false,fix:false,mood:'smug',reply:''};
  if(!g.point && mentionsLine(text,1)) r.point=true;
  const pointOK = g.point||r.point;
  if(!g.reason && L.reason.test(text) && (pointOK || /반례/.test(text))) r.reason=true;
  if(!g.fix && L.fix.test(text) && (pointOK)) r.fix=true;
  if(r.reason||r.fix) r.mood='rattled';
  if(r.fix && (g.reason||r.reason)) r.reply='크으… 거기까지 알아냈단 말이냐…';
  else if(r.reason) r.reply=L.onReason;
  else if(r.fix) r.reply='그렇게 고치면 된다고? 흥, 내 것이 왜 틀렸는지부터 설명해 보시지.';
  else if(r.point) r.reply=L.onPoint;
  else if([2,3,4].some(n=>mentionsLine(text,n))) r.reply=L.deflect;
  else if(C.stall>=4) r.reply=L.hint;
  else r.reply=['흥, 무슨 소리인지 모르겠군. 어느 줄이 왜 틀렸는지 똑바로 말해 봐라.','후후, 그 정도로는 날 흔들 수 없다. 근거를 대 보시지.','증거가 없군. 내 증명의 어느 부분이 문제지?'][C.count%3];
  return r;
}
function buildPrompt(c,text,speaker){
  const hist=C.msgs.filter(m=>m.who!=='gain').slice(-8).map(m=>(m.who==='thief'?'괴도: ':'학생('+m.name+'): ')+m.text).join('\n');
  const g=C.gauge;
  return '너는 고등학교 1학년 수학 수업용 추리 게임의 악당 캐릭터 ‘괴도 프루프’다. 학생 모둠이 네가 쓴 틀린 증명을 심문하고 있다.\n\n'+
   '[사건 명제] '+c.statement+'\n[괴도가 쓴 증명 ('+c.method+')]\n'+c.lines.map((l,i)=>(i+1)+'. '+l).join('\n')+'\n\n'+
   '[비밀 정답과 게이지 기준 — 학생에게 정답을 먼저 말하지 말 것]\n[[CASE_KEY:'+C.key+']]\n\n'+
   '[이미 충족한 기준] point: '+(g.point?'완료':'미완료')+', reason: '+(g.reason?'완료':'미완료')+', fix: '+(g.fix?'완료':'미완료')+'\n'+
   '[게이지가 오르지 않은 연속 메시지 수] '+C.stall+'\n\n[지금까지의 대화]\n'+(hist||'(없음)')+'\n\n[방금 보낸 학생 메시지] 학생('+speaker+'): '+text+'\n\n'+
   '규칙:\n- 이번 학생 메시지(앞선 대화 맥락 포함)가 새로 충족한 기준만 true로 표시한다. 이미 완료된 기준은 false로 둔다. 한 메시지가 여러 기준을 동시에 충족할 수 있다.\n'+
   '- 학생 설명이 기준을 충족해도 괴도는 쉽게 인정하지 않는 척 능청스럽게 버티되, 판정은 정직하게 한다. 틀린 주장에는 되묻는다.\n'+
   '- 2, 3, 4번 줄만 지목하면 정답을 말하지 말고 원인이 앞쪽에 있을 수 있음을 슬쩍 암시한다.\n'+
   '- 게이지가 4회 이상 정체되어 있으면 정답을 직접 말하지 않는 아주 작은 힌트 하나를 준다.\n'+
   '- 수업과 무관하거나 부적절한 말에는 캐릭터를 유지하며 사건으로 돌아가게 한다. 학생을 비하하지 않는다.\n'+
   '- reply는 괴도의 반말 대사로 2문장, 80자 이내. 소리 내어 읽기 좋게 쓴다.\n- mood는 학생이 날카로운 지적을 했으면 "rattled", 아니면 "smug".\n\n'+
   '다음 JSON 하나만 출력하라: {"reply": "...", "point": true/false, "reason": true/false, "fix": true/false, "mood": "smug" 또는 "rattled"}';
}
async function judge(c,text,speaker){
  if(S.sample){
    try{
      const v = await S.sample.json(buildPrompt(c,text,speaker), {modelTier:'quick', cache:false});
      if(v && typeof v.reply==='string' && v.reply.trim()){ C.notice=''; return {reply:v.reply.trim(), point:!!v.point&&!C.gauge.point, reason:!!v.reason&&!C.gauge.reason, fix:!!v.fix&&!C.gauge.fix, mood:v.mood==='rattled'?'rattled':'smug'}; }
    }catch(e){
      if(e && e.code==='not_granted'){ S.sample=null; setBadge(); }
      C.notice='AI 괴도와 연결되지 않아 기본 판정으로 진행했어요.';
    }
  }
  return localJudge(c,text);
}
async function sendMsg(text, speaker){
  const c=CASES[C.key];
  C.count++; C.turn++; C.busy=true;
  const msg={who:'student',name:speaker,text}; C.msgs.push(msg); renderCase();
  const r = await judge(c,text,speaker);
  const gains=[]; let w=0;
  if(r.point){ C.gauge.point=true; gains.push('틀린 줄 찾기 +30'); w+=30; }
  if(r.reason){ C.gauge.reason=true; gains.push('이유 설명 +40'); w+=40; }
  if(r.fix){ C.gauge.fix=true; gains.push('고치는 법 +30'); w+=30; }
  msg.weight=w;
  C.stall = gains.length?0:C.stall+1;
  C.msgs.push({who:'thief',text:r.reply});
  if(gains.length){ C.msgs.push({who:'gain',text:'자백 게이지 '+gains.join(' · ')}); sfx.chime(); }
  C.busy=false; renderCase();
  document.querySelectorAll('.case-head .thief').forEach(el=>el.setAttribute('class','thief '+(r.mood||'smug')));
  await speak(r.reply);
  if(gaugePct()>=100) setTimeout(startQuiz, 500);
}

/* ---------- 지목 심문 ---------- */
function startQuiz(){
  const c=CASES[C.key], ms=members();
  const pool=c.quiz.map((q,i)=>i).filter(i=>!C.usedQ.includes(i)); const qi=(pool.length?pool:c.quiz.map((q,i)=>i))[Math.floor(Math.random()*(pool.length||c.quiz.length))];
  C.usedQ.push(qi); const q=c.quiz[qi]; const callee=ms[Math.floor(Math.random()*ms.length)];
  const line='좋다, 거의 다 왔군. 하지만 자백하기 전에 확인하겠다. '+callee+', 네가 직접 답해 봐.';
  const root=document.getElementById('modalRoot');
  root.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="괴도의 지목 심문"><div class="modal-box"><div class="mini-thief" style="width:120px;height:auto">'+thiefSVG('rattled')+'</div><div>'+
   '<div style="color:var(--stage-muted);font-size:14px">괴도의 지목 심문</div><div class="callee">'+esc(callee)+'</div><p class="q">'+esc(q.q)+'</p>'+
   q.o.map((o,i)=>'<button class="opt" data-o="'+i+'">'+esc(o)+'</button>').join('')+'<p style="font-size:13px;color:var(--stage-muted);margin:10px 0 0">지목된 학생이 직접 고르세요. 틀리면 심문 1회가 추가돼요.</p></div></div></div>';
  sfx.sting(); speak(line+' '+q.q);
  root.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{
    stopSpeech();
    if(+b.dataset.o===q.a){
      root.innerHTML=''; finishCase();
    } else {
      C.count++; sfx.buzz();
      root.querySelector('.modal-box').innerHTML='<div class="mini-thief" style="width:120px;height:auto">'+thiefSVG('smug')+'</div><div><div class="callee">후후후…</div><p class="q">모둠원 모두가 이해한 건 아니었군. 심문 1회 추가다. 다시 설명을 맞춰 보고 와라.</p><button class="opt" id="again">다른 모둠원에게 다시 질문 받기</button></div>';
      speak('후후후. 모둠원 모두가 이해한 건 아니었군. 심문 1회 추가다.');
      root.querySelector('#again').onclick=()=>{ stopSpeech(); startQuiz(); };
    }
  });
}
async function finishCase(){
  const c=CASES[C.key];
  const studs=C.msgs.filter(m=>m.who==='student'); let key=null;
  studs.forEach(m=>{ if((m.weight||0)>0 && (!key || m.weight>=key.weight)) key=m; });
  G.solved[C.key]={count:C.count, keyLine:key?{name:key.name,text:key.text}:null, thief:C.msgs.filter(m=>m.who==='thief').map(m=>m.text).slice(-5)};
  saveG();
  await cutscene({kicker:'사건 '+c.no+' 해결', heading:'괴도의 자백', lines:c.confess, finalStamp:true});
  C.phase='solved'; renderCase();
}

/* ---------- 시작 ---------- */
(function boot(){
  loadG();
  const t=(location.hash||'').slice(1);
  if(t==='race') withSid(startRace);
  else if(t==='ads') withSid(startAds);
  else if(t==='prev'||t==='open') withSid(()=>startSession(t));
  else if(t==='cases') go('team');
  else if(t==='case1'||t==='case2'){ CASE_TARGET=t==='case1'?'c1':'c2'; go('team'); }
  else go('home');
})();
</script>
